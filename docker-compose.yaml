services:
  postgres:
    image: postgres:16-alpine
    container_name: lexdossier-db
    environment:
      POSTGRES_DB: lexdossier
      POSTGRES_USER: lex
      POSTGRES_PASSWORD: lex
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U lex -d lexdossier" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: lexdossier-app

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lexdossier
      SPRING_DATASOURCE_USERNAME: lex
      SPRING_DATASOURCE_PASSWORD: lex
    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres_data:
