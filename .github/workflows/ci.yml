name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lexdossier
          POSTGRES_USER: lex
          POSTGRES_PASSWORD: lex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lex -d lexdossier"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Lancer les tests
        run: |
          chmod +x mvnw
          ./mvnw -B test
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/lexdossier
          SPRING_DATASOURCE_USERNAME: lex
          SPRING_DATASOURCE_PASSWORD: lex